<!doctype html>
<html lang="EN">
<head>
    <title>Grid Layout Samples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: whitesmoke;
            font-family: 'Lato', sans-serif;
            min-height: 100vh;

            display: grid;
            grid-template-columns: repeat(9,1fr);
            grid-auto-rows: 75px auto 75px;
            grid-template-areas:
                "hd hd hd hd hd hd hd hd hd"
                "mn mn mn mn mn mn mn sb sb"
                "ft ft ft ft ft ft ft ft ft"
            ;
        }

        .el {
            background-color: rebeccapurple;
            color: white;
            display: grid;
            place-content: center;
        }

        .header {
            grid-area: hd;
        }

        .sidebar {
            background-color: #1e77ba;
            grid-area: sb;
        }

        .footer {
            grid-area: ft;
        }

        .container {
            grid-area: mn;
            margin: 1em;
            display: grid;
            grid-template-columns: repeat(2,1fr 2fr);
            grid-auto-rows: minmax(50px,auto);
            gap: 1rem;
        }

        .box {
            background-color: #1e77ba;
            color: white;
            font-size: 2em;
            padding: 0.5rem;
        }

        .box:first-child {
            background-color: red;
            grid-column: 1 / 4;
            grid-row: 1 / 3;

            display: grid;
            place-content: center;
        }

        .box:nth-child(2) {
            background-color: purple;
            grid-column: 1 / 5;
            grid-row: 3 / 4;

            display: grid;
            place-content: center;
        }
    </style>
</head>
<body>

<header class="header el">
    <h1>Header</h1>
</header>
<main class="container">

    <div class="box">
        <h2>one</h2>
    </div>

    <div class="box">
        <h2>two</h2>
        <p class="digit">02</p>
        <p>footer</p>
    </div>

    <div class="box">
        <h2>three</h2>
        <p class="digit">03</p>
    </div>

    <div class="box">
        <h2>four</h2>
        <p class="digit">04</p>
        <p>footer</p>
    </div>

    <div class="box">
        <h2>five</h2>
        <p class="digit">05</p>
    </div>

    <div class="box">
        <h2>six</h2>
        <p class="digit">06</p>
        <p>footer</p>
    </div>

</main>
<aside class="sidebar el">
    <h2>Sidebar</h2>
</aside>
<footer class="footer el">
    <h2>Footer</h2>
</footer>

</body>
</html>
